name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rabsong
          POSTGRES_PASSWORD: rabsong_test
          POSTGRES_DB: rabsong_test
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U rabsong -d rabsong_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rabsong:rabsong_test@localhost:5437/rabsong_test?schema=public
      SESSION_SECRET: test-only-session-secret-not-for-production-32
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://rabsong:rabsong_test@localhost:5437/rabsong_test?schema=public
          APP_ENV: test
