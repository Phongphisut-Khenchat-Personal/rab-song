# ฐานเดิมที่สร้างด้วย postgres:16-alpine อยู่ใน volume ชื่อ rabsong_pg
# ไฟล์นี้ไม่ mount volume นั้น และไม่ลบมัน ฐานใหม่ใช้ rabsong_postgis
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rabsong
      POSTGRES_PASSWORD: rabsong_dev
      POSTGRES_DB: rabsong
    ports:
      - "5436:5432"
    volumes:
      - rabsong_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabsong -d rabsong"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres_test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rabsong
      POSTGRES_PASSWORD: rabsong_test
      POSTGRES_DB: rabsong_test
    ports:
      - "5437:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rabsong -d rabsong_test"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rabsong_postgis:
